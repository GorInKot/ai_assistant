# Render Blueprint — корпоративный ИИ-ассистент (FastAPI + React).
# Деплой: Render Dashboard -> New -> Blueprint -> выбрать этот репозиторий.
#
# ВНИМАНИЕ. После перехода на React-фронт (frontend/dist) на Render runtime: python
# нет Node.js. Варианты для production-деплоя нового UI:
#   1. Перейти на runtime: docker и описать сборку в Dockerfile
#      (RUN apt-get install nodejs && npm install && npm run build).
#   2. Использовать Render Native Runtime с buildpack, который включает Node.
#   3. Разнести: фронт — Render Static Site (npm run build), бэкенд — Web Service.
#
# Текущая конфигурация ниже работает только со старым static/index.html
# (новый UI отдаётся только если frontend/dist собран локально и закоммичен,
# что делать НЕ рекомендуется). До решения по Docker prod-деплой нового UI
# не работает — изучайте локально через npm run dev + uvicorn.
services:
  - type: web
    name: ai-assistant
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: ENABLE_LLM_RERANK
        value: "0"
      # Секреты — задаются вручную в дашборде Render, в репозиторий не попадают.
      - key: LLM_API_KEY
        sync: false
      # JWT_SECRET Render сгенерирует автоматически при первом деплое.
      - key: JWT_SECRET
        generateValue: true
